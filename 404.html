<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Cloud | 404 Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-content { text-align: center; margin: 10rem auto; }
        .error-code { font-family: 'JetBrains Mono', monospace; font-size: 6rem; color: var(--naranja-energia); font-weight: bold; }
        .error-msg { font-size: 2rem; color: var(--texto-blanco); margin-bottom: 2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand" style="text-decoration:none; color:var(--texto-blanco);">SOLAR CLOUD</a>
        <div class="nav-links">
            <a href="index.html#planes">/PLANES</a>
            <a href="index.html#ping">/NETWORK</a>
        </div>
    </nav>
    <div class="container">
        <main class="error-content">
            <div class="error-code">404</div>
            <div class="error-msg">SYSTEM FAULT: ENDPOINT NOT FOUND</div>
            <a href="index.html" class="btn-primary">RETURN TO ROOT</a>
        </main>
    </div>

  <script id="dynamic-year">document.getElementById("year").textContent = new Date().getFullYear();</script>

    <!-- Chatbot Widget -->
    <div id="solar-sc-assistant-container">
      <div id="solar-sc-assistant-window">
        <div class="sc-assistant-header">
          <div class="sc-assistant-title-container">
            <div class="sc-assistant-avatar">☀️</div>
            <div>
              <h3 class="sc-assistant-title">Solar AI</h3>
              <div class="sc-assistant-status">Online</div>
            </div>
          </div>
          <button
            class="sc-assistant-close-btn"
            onclick="toggleAssistantChat()"
          >
            &times;
          </button>
        </div>
        <div class="sc-assistant-messages" id="sc-assistant-messages">
          <div class="sc-assistant-msg bot">
            <p>¡Hola! Soy Solar AI, tu asistente virtual. ¿En qué te puedo ayudar hoy? 🚀</p>
          </div>
        </div>
        <div class="sc-assistant-typing" id="sc-assistant-typing">
          Solar AI está escribiendo...
        </div>
        <div class="sc-assistant-input-area">
          <input
            type="text"
            id="sc-assistant-input"
            class="sc-assistant-input"
            placeholder="Escribe tu mensaje..."
            autocomplete="off"
            onkeypress="if(event.key === 'Enter') sendAssistantMessage()"
          />
          <button
            id="sc-assistant-send-btn"
            class="sc-assistant-send-btn"
            aria-label="Enviar"
            onclick="sendAssistantMessage()"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
      <button
        id="solar-sc-assistant-btn"
        aria-label="Open Chat"
        onclick="toggleAssistantChat()"
      >
        <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
        </svg>
      </button>
    </div>

</body>
</html>
