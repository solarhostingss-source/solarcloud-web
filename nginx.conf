##############################################################
# SOLAR CLOUD - Nginx Configuration (HTTP + HTTPS)
# Archivo: /etc/nginx/sites-available/solarhosting
# SSL gestionado por Certbot / Let's Encrypt
##############################################################

# ── Redirigir HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name solarcloud.lat www.solarcloud.lat;

    # Certbot desafío ACME (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://solarcloud.lat$request_uri;
    }
}

# ── Redirigir www → sin www (HTTPS) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.solarcloud.lat;

    ssl_certificate     /etc/letsencrypt/live/solarcloud.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solarcloud.lat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://solarcloud.lat$request_uri;
}

# ── SERVIDOR PRINCIPAL (HTTPS) ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solarcloud.lat;

    # SSL (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/solarcloud.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solarcloud.lat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Raíz del sitio
    root /var/www/solarcloud;
    index index.html;
    charset utf-8;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript image/png image/jpeg image/webp image/svg+xml;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── RUTAS LIMPIAS (sin .html) ─────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    location = /minecraft {
        try_files /minecraft.html =404;
    }

    location = /bots {
        try_files /bots.html =404;
    }

    location = /terminos {
        try_files /terminos.html =404;
    }

    location = /privacidad {
        try_files /privacidad.html =404;
    }

    location = /reembolsos {
        try_files /reembolsos.html =404;
    }

    location = /vps {
        try_files /vps.html =404;
    }
    # ── REDIRIGIR .html → ruta limpia ────────────────────────
    # Ej: solarcloud.lat/minecraft.html → solarcloud.lat/minecraft
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # ── ARCHIVOS ESTÁTICOS (CSS, JS, imágenes) ───────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── FALLBACK GENERAL ─────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ── PÁGINA DE ERROR ───────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
