<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Countryballs 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Efectos Visuales Overlay -->
        <div class="vignette"></div>
        <div class="crt"></div>
        <div id="red-flash-overlay" class="hidden"></div>
        <div id="fade-to-black" class="hidden"></div>
        <div id="static-overlay" class="hidden"></div>

        <!-- Vista de la Oficina Panorámica -->
        <div id="office-view">
            <div id="office-bg">
                <!-- Background visual -->
                <div class="desk"></div>
                <div class="window"></div>
                
                <!-- Zonas de interacción -->
                <div id="maintenance-trigger" class="side-trigger left-trigger" onclick="game.toggleMaintenance()"><p>◂ Maintenance</p></div>
                <div id="camera-trigger" class="side-trigger right-trigger" onclick="game.toggleMonitor()"><p>Cameras ▸</p></div>
                
                <!-- Enemigos en Oficina -->
                <div id="phantom-office" class="hidden">
                    <!-- Placeholder para Argentina -->
                    <div class="placeholder-ball argentina"></div>
                </div>
            </div>
        </div>

        <!-- HUD Principal -->
        <div id="hud">
            <div id="time-display">12:00 AM</div>
            <div id="night-display">Night 1</div>
        </div>

        <!-- Panel de Mantenimiento (Izquierda) -->
        <div id="maintenance-panel" class="panel hidden slide-in-left">
            <h2>Maintenance Panel</h2>
            
            <div class="sys-row">
                <span class="sys-name">Audio Devices</span>
                <span id="audio-status" class="status online">Online</span>
                <button onclick="game.maintenance.reboot('audio')">Reboot</button>
            </div>
            
            <div class="sys-row">
                <span class="sys-name">Camera System</span>
                <span id="camera-status" class="status online">Online</span>
                <button onclick="game.maintenance.reboot('camera')">Reboot</button>
            </div>
            
            <div class="sys-row">
                <span class="sys-name">Ventilation</span>
                <span id="vent-status" class="status online">Online</span>
                <button onclick="game.maintenance.reboot('vent')">Reboot</button>
            </div>

            <button id="reboot-all-btn" onclick="game.maintenance.rebootAll()">Reboot All</button>
            
            <div class="progress-container">
                <div id="reboot-progress"></div>
            </div>

            <div id="phantom-maintenance" class="hidden">
                <!-- Placeholder para Italia -->
                <div class="placeholder-ball italia"></div>
            </div>
            
            <button class="close-btn" onclick="game.toggleMaintenance()">Close</button>
        </div>

        <!-- Panel de Cámaras (Derecha) -->
        <div id="camera-panel" class="panel hidden slide-in-right">
            <div id="camera-screen">
                <div id="cam-static" class="hidden"></div>
                <div id="cam-feed">CAM 1</div>
                
                <div id="springtrap-cam" class="hidden">
                    <img src="assets/springtrap_venezuela.png" alt="Springtrap">
                </div>
                
                <div id="phantom-cam" class="hidden">
                    <img src="assets/phantom_colombia.png" alt="Phantom">
                </div>
            </div>
            
            <div id="camera-controls">
                <div class="tabs">
                    <button id="tab-cams" class="active" onclick="game.monitor.switchTab('cams')">Cams</button>
                    <button id="tab-vents" onclick="game.monitor.switchTab('vents')">Vents</button>
                </div>
                
                <div id="map-cams" class="map-view">
                    <!-- Botones de cámara (se generan en JS) -->
                </div>
                
                <div id="map-vents" class="map-view hidden">
                    <!-- Botones de ventilación (se generan en JS) -->
                </div>
                
                <button id="play-audio-btn" onclick="game.monitor.playAudio()">Play Audio</button>
            </div>
            
            <button class="close-btn" onclick="game.toggleMonitor()">Close</button>
        </div>

        <!-- Pantallas de Fin de Juego -->
        <div id="jumpscare-screen" class="hidden">
            <img id="jumpscare-img" src="" alt="Jumpscare">
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>He got you.</p>
            <button onclick="location.reload()">Try Again</button>
        </div>
        
        <div id="win-screen" class="screen hidden">
            <h1 class="flash">6:00 AM</h1>
            <button onclick="location.reload()">Next Night</button>
        </div>
    </div>
    
    <script src="game.js"></script>

  <script id="dynamic-year">document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
